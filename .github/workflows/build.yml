name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  firmware:
    name: pio run (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - cardputer
          - cardputer-launcher
          - cardputer-launcher-dual
          - cardputer-ota
          - godzilla
          - godzilla-amoled206

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: warn
          retention-days: 14

  c5-node:
    name: idf.py build (c5_node / esp32c5)
    runs-on: ubuntu-latest
    # The C5 node is an ESP-IDF project, not PlatformIO — the pio matrix above
    # never compiled it, so a typo or bad IDF API in c5_node/ used to surface
    # only at flash time on the bench. This job builds it on every push/PR.
    # The libnet80211 deauth-injection patch (tools/patch_libnet80211.sh) is a
    # runtime TX fix and is NOT needed to compile, so CI skips it.
    steps:
      - uses: actions/checkout@v7

      - name: Build c5_node firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32c5
          path: c5_node

      - name: Verify committed C5 partition table matches partitions.csv
        # The web-flasher ships docs/flash/bin/trident-c5/partition-table.bin.
        # It must byte-match the table ESP-IDF just built from partitions.csv,
        # or the flasher writes a stale layout (regression guard for the 1M->2M
        # drift fixed in PR #26). Regenerate with:
        #   cp c5_node/build/partition_table/partition-table.bin \
        #      docs/flash/bin/trident-c5/partition-table.bin
        run: |
          built=c5_node/build/partition_table/partition-table.bin
          committed=docs/flash/bin/trident-c5/partition-table.bin
          if ! cmp -s "$built" "$committed"; then
            echo "::error file=${committed}::Committed C5 partition table is stale — it does not match the table built from c5_node/partitions.csv. Regenerate: cp ${built} ${committed}"
            cmp "$built" "$committed" || true
            exit 1
          fi
          echo "C5 partition table is in sync with partitions.csv."

      - name: Upload C5 firmware artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-c5-node
          path: |
            c5_node/build/poseidon_c5_node.bin
            c5_node/build/bootloader/bootloader.bin
            c5_node/build/partition_table/partition-table.bin
          if-no-files-found: warn
          retention-days: 14

  native-tests:
    name: pio test (native-test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run host-side unit tests
        run: pio test -e native-test

  consistency:
    name: release-metadata consistency
    runs-on: ubuntu-latest
    # Cheap text gate: catches version strings / flasher manifests drifting
    # apart (the class of bug fixed in PRs #26/#27). See
    # tools/check_release_consistency.py — also runnable locally before a release.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check version + flasher-manifest consistency
        run: python3 tools/check_release_consistency.py
